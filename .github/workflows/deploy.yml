name: Deploy to GitHub Pages

# Deploy dari source dengan workflow Actions sendiri (bukan "Deploy from a branch").
# Keuntungannya: batas lunak 10 build/jam TIDAK berlaku untuk workflow kustom.
# Rujukan: docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Hanya satu deploy berjalan pada satu waktu; jangan batalkan deploy yang sedang
# berjalan di tengah jalan karena artinya situs bisa tertinggal setengah terbit.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Wajib sebelum upload: menyuntikkan base path & metadata Pages yang benar.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
